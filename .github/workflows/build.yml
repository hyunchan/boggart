name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Android SDK는 ubuntu-latest 러너에 기본 설치되어 있고 ANDROID_HOME이 설정된다.
      - run: ./gradlew build :sample:assembleDebug
